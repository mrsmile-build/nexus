<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>NEXUS</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0f; color: #e8e8f0; margin: 0; height: 100vh; display: flex; flex-direction: column; }
button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; }
#setup { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
#setup h2 { color: #6f9bff; letter-spacing: 3px; }
#setup input { height: 52px; width: 320px; max-width: 90%; padding: 0 16px; margin: 18px 0; background: #17171d; color: #fff; border: 1px solid #2a2a33; border-radius: 26px; text-align: center; outline: none; }
#setup button { padding: 13px 34px; background: linear-gradient(135deg,#3d6bff,#7a5cff); border-radius: 26px; font-weight: 700; }
#app { display: none; flex: 1; flex-direction: column; height: 100vh; max-width: 820px; width: 100%; margin: 0 auto; }
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
.icon-btn { padding: 9px; border-radius: 12px; color: #cfd3e4; display: flex; }
.icon-btn:active { background: #1a1a22; }
#empty { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; }
#empty h1 { font-size: 21px; font-weight: 700; margin: 0; }
#empty p { color: #8b8fa3; font-size: 13px; margin: 0; max-width: 300px; }
#chat { flex: 1; overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; }
.msg { margin: 6px 0; padding: 12px 16px; border-radius: 20px; max-width: 88%; line-height: 1.55; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; animation: fadein .25s ease; }
@keyframes fadein { from {opacity:0; transform: translateY(6px);} to {opacity:1;} }
.user { background: linear-gradient(135deg,#2b4fd8,#4f7cff); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.ai { background: #141419; border: 1px solid #23232d; align-self: flex-start; border-bottom-left-radius: 6px; max-width: 100%; padding: 16px 18px; white-space: normal; }
.msg strong { color: #cfe0ff; }
.meta { font-size: .68em; color: #6d7185; margin-top: 8px; font-style: italic; }
.actions { display: flex; gap: 2px; margin-top: 6px; opacity: .6; }
.act { padding: 4px 9px; border-radius: 8px; font-size: 13px; color: #9aa0b5; }
.act:active { background: #1a1a22; }
.typing { display: flex; gap: 5px; padding: 6px 2px; }
.typing span { width: 8px; height: 8px; background: #666; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing span:nth-child(1){animation-delay:-.32s}.typing span:nth-child(2){animation-delay:-.16s}
@keyframes bounce {0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
#chips { display: flex; gap: 8px; padding: 4px 14px 8px; overflow-x: auto; scrollbar-width: none; justify-content: center; flex-wrap: wrap; }
.chip { flex: none; background: #141419; border: 1px solid #262631; border-radius: 16px; padding: 9px 14px; font-size: 13px; color: #dfe3f4; }
#imgchip { display: none; margin: 0 14px 8px; background: #12241a; border: 1px solid #1f4030; color: #9fe8c0; border-radius: 12px; padding: 7px 12px; font-size: 13px; align-items: center; gap: 10px; }
#inputbar { display: flex; align-items: center; gap: 4px; margin: 0 14px calc(14px + env(safe-area-inset-bottom)); background: #17171d; border: 1px solid #262631; border-radius: 30px; padding: 6px 8px 6px 6px; }
#msg { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 15.5px; padding: 10px 6px; }
#msg::placeholder { color: #6d7185; }
.pill-btn { padding: 10px; border-radius: 50%; color: #cfd3e4; display: flex; }
.pill-btn.live { color: #ff5c5c; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
#sendbtn { background: #e8e8f0; color: #0a0a0f; border-radius: 50%; padding: 10px; display: flex; }
#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
#backdrop.open { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 82%; max-width: 320px; background: #101016; border-right: 1px solid #23232d; transform: translateX(-100%); transition: transform .25s ease; z-index: 50; display: flex; flex-direction: column; padding: 16px 12px; }
#drawer.open { transform: none; }
.d-brand { font-weight: 800; letter-spacing: 3px; font-size: 18px; padding: 4px 8px 14px; }
#chat-search { background: #17171d; border: 1px solid #2a2a33; border-radius: 12px; color: #fff; padding: 10px 14px; outline: none; margin-bottom: 12px; }
#drawer h3 { color: #6d7185; font-size: 11px; letter-spacing: 2px; margin: 10px 8px 6px; }
#session-list { flex: 1; overflow-y: auto; }
.s-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; margin-bottom: 2px; font-size: 14px; color: #cfd3e4; }
.s-row.active { background: #1d2337; color: #fff; }
.s-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 78%; }
.s-menu { color: #6d7185; padding: 4px 10px; font-size: 16px; }
.nav-item { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; font-size: 14px; color: #cfd3e4; }
.nav-item:active { background: #1a1a22; }
#drawer footer { border-top: 1px solid #23232d; padding: 12px 4px 0; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,#3d6bff,#7a5cff); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.newchat-pill { background: #e8e8f0; color: #0a0a0f; border-radius: 22px; padding: 10px 16px; font-weight: 700; font-size: 14px; }
#menu-modal { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) scale(.95); background: #1d2337; border: 1px solid #2a2a33; border-radius: 16px; z-index: 99; display: none; flex-direction: column; min-width: 220px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#menu-modal.open { display: flex; transform: translateX(-50%) scale(1); }
#menu-modal button { padding: 15px 20px; text-align: left; font-size: 14.5px; border-bottom: 1px solid #23232d; display: flex; justify-content: space-between; }
#menu-modal button:last-child { border-bottom: none; }
#menu-modal button:active { background: #232c47; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: #1d2337; border: 1px solid #2a2a33; color: #e8e8f0; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 99; animation: fadein .2s; max-width: 85%; text-align: center; }

.md { font-size: 15.5px; line-height: 1.7; }
.md p { margin: 10px 0; }
.md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.35; color: #fff; }
.md h2 { font-size: 18px; } .md h3 { font-size: 16.5px; } .md h4 { font-size: 15.5px; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li { margin: 5px 0; }
.md hr { border: none; border-top: 1px solid #2a2a33; margin: 16px 0; }
.md em { color: #b8bdd4; }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid #2a2a33; border-radius: 10px; }
.md table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.md th { background: #1a1a22; color: #cfe0ff; text-align: left; }
.md th, .md td { padding: 9px 11px; border-bottom: 1px solid #23232d; border-right: 1px solid #23232d; vertical-align: top; }
.md th:last-child, .md td:last-child { border-right: none; }
.md tr:last-child td { border-bottom: none; }
pre.code { background: #0d0d12; border: 1px solid #23232d; border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 12px 0; font-family: Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; color: #9fe8c0; white-space: pre; }
code.inline { background: #1a1a22; border-radius: 6px; padding: 1px 6px; font-family: monospace; font-size: 13px; color: #ffd58a; }

.stage { font-size: 12px; color: #6d7185; margin-top: 8px; font-style: italic; }
pre.code { position: relative; }
.codecopy { position: absolute; top: 6px; right: 6px; background: #1a1a22; border: 1px solid #2a2a33; color: #9aa0b5; border-radius: 8px; padding: 3px 8px; font-size: 12px; }
.tbl { background: linear-gradient(to left, rgba(20,20,25,.85), transparent) right/22px 100% no-repeat; }
.md table { font-size: 12.8px; }
.md th, .md td { padding: 8px 9px; }
</style>
</head>
<body>
<div id="setup">
  <h2>NEXUS</h2>
  <p style="color:#8b8fa3;">Enter your X-NEXUS-Key once. It stays on this device.</p>
  <input type="password" id="key-input" placeholder="Paste your API key">
  <button onclick="saveKey()">Unlock Brain</button>
</div>
<div id="app">
  <div id="topbar">
    <button class="icon-btn" onclick="openDrawer()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <button class="icon-btn" onclick="newChat()"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </div>
  <div id="empty">
    <svg width="72" height="72" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6bff"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs><circle cx="50" cy="26" r="12" fill="url(#g)"/><circle cx="26" cy="66" r="12" fill="url(#g)"/><circle cx="74" cy="66" r="12" fill="url(#g)"/><path d="M50 26L26 66M50 26l24 40M26 66h48" stroke="url(#g)" stroke-width="6"/></svg>
    <h1>How can NEXUS help you today?</h1>
    <p>Street-smart intelligence for business, nature, materials, farming & vision.</p>
  </div>
  <div id="chat"></div>
  <div id="chips">
    <button class="chip" onclick="useChip('I am a broke guy in Nigeria. Score 10 proven production businesses I can start today.')">💼 Business</button>
    <button class="chip" onclick="useChip('Is this plant or remedy safe, and what is it traditionally used for? ')">🌿 Nature</button>
    <button class="chip" onclick="useChip('How do I manufacture this product cheaper with local materials? ')">🏭 Materials</button>
    <button class="chip" onclick="useChip('My soil is poor. What exactly do I add to grow bigger harvests?')">🌱 Grow</button>
    <button class="chip" onclick="useChip('Review this code like a ruthless staff engineer and fix every issue: ')">Code</button>
    <button class="chip" onclick="useChip('Teach me this subject deeply, from fundamentals to mastery: ')">📚 Studies</button>
  </div>
  <div id="imgchip">🖼 Image attached <button onclick="clearImage()" style="color:#9fe8c0;font-weight:700;">✕</button></div>
  <div id="inputbar">
    <button class="pill-btn" onclick="document.getElementById('img').click()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <input type="file" id="img" accept="image/*" style="display:none" onchange="pickImage(this)">
    <input type="text" id="msg" placeholder="Ask NEXUS anything..." onkeypress="if(event.key==='Enter')send()">
    <button class="pill-btn" id="micbtn" onclick="toggleMic()"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg></button>
    <button id="sendbtn" onclick="send()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>
<div id="backdrop" onclick="closeDrawer()"></div>
<aside id="drawer">
  <div class="d-brand">NEXUS</div>
  <input id="chat-search" placeholder="Search chats" oninput="renderSessions(this.value)">
  <div id="session-list"></div>
  <h3>TOOLS</h3>
  <div class="nav-item" onclick="toast('⏰ Scheduled tasks land in Phase E — the next build.')">🕒 Scheduled</div>
  <div class="nav-item" onclick="toast('🧠 Memory lives in Qdrant. Ask: “what do you remember about cement?”')">🧠 Memory</div>
  <footer>
    <div class="avatar">A</div>
    <div style="flex:1"><div style="font-size:14px;font-weight:600">Admin</div><div style="font-size:11px;color:#6d7185">Unlimited · all engines</div></div>
    <button onclick="resetKey()" style="font-size:16px">🔑</button>
    <button class="newchat-pill" onclick="newChat(); closeDrawer();">+ New chat</button>
  </footer>
</aside>
<div id="menu-modal">
  <button onclick="menuRename()"><span>✏️ Rename</span></button>
  <button onclick="menuStar()"><span>⭐ Star / Unstar</span></button>
  <button onclick="menuDelete()" style="color:#ff6b6b"><span>🗑 Delete</span></button>
</div>
<script src="config.js"></script>
<script>
const API = window.NEXUS_API_URL || window.location.origin;
const urlKey = new URLSearchParams(window.location.search).get('key');
if (urlKey) { localStorage.setItem('nexus_key', urlKey); history.replaceState(null, '', window.location.pathname); }
let key = localStorage.getItem('nexus_key');
let pendingImage = "";
let menuFor = null;
let sessions = JSON.parse(localStorage.getItem('nexus_sessions_v1') || '[]');
let activeId = localStorage.getItem('nexus_active_v1');
if (!sessions.length) { sessions.push({id: String(Date.now()), title: 'New Chat', msgs: []}); activeId = sessions[0].id; }
if (!sessions.find(s => s.id === activeId)) activeId = sessions[0].id;

function saveSessions(){ localStorage.setItem('nexus_sessions_v1', JSON.stringify(sessions)); localStorage.setItem('nexus_active_v1', activeId); }
function active(){ return sessions.find(s => s.id === activeId); }
function openDrawer(){ renderSessions(''); document.getElementById('drawer').classList.add('open'); document.getElementById('backdrop').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }
function resetKey(){ localStorage.removeItem('nexus_key'); location.reload(); }
function useChip(t){ document.getElementById('msg').value = t; document.getElementById('msg').focus(); }
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function fmt(t){
  let s = String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const codes = [];
  s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, function(m, code){
    codes.push('<pre class="code"><code>' + code.replace(/^\n+|\n+$/g,'') + '</code></pre>');
    return '\u0000C' + (codes.length-1) + '\u0000';
  });
  const lines = s.split('\n'); const out = []; let rows = [];
  const parseRow = l => { let x = l.trim(); if (x.startsWith('|')) x = x.slice(1); if (x.endsWith('|')) x = x.slice(0,-1); return x.split('|').map(c => c.trim()); };
  const isSep = cells => cells.length && cells.every(c => /^:?-{2,}:?$/.test(c));
  const buildTable = () => {
    if (!rows.length) return '';
    let h = '<div class="tbl"><table><thead><tr>';
    rows[0].forEach(c => h += '<th>' + c + '</th>');
    h += '</tr></thead><tbody>';
    for (let i = 1; i < rows.length; i++){ h += '<tr>'; rows[i].forEach(c => h += '<td>' + c + '</td>'); h += '</tr>'; }
    return h + '</tbody></table></div>';
  };
  lines.forEach(line => {
    const lt = line.trim();
    if (lt.startsWith('|') && lt.indexOf('|', 1) > 0){ const cells = parseRow(lt); if (!isSep(cells)) rows.push(cells); return; }
    if (rows.length){ out.push(buildTable()); rows = []; }
    out.push(line);
  });
  if (rows.length) out.push(buildTable());
  s = out.join('\n');
  s = s.replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>').replace(/^---+$/gm,'<hr>');
  s = s.replace(/(?:^|\n)((?:[-*] .+(?:\n|$))+)/g, (m, body) => '\n<ul>' + body.trim().split('\n').map(l => '<li>' + l.replace(/^[-*] /,'') + '</li>').join('') + '</ul>');
  s = s.replace(/(?:^|\n)((?:\d+[.)] .+(?:\n|$))+)/g, (m, body) => '\n<ol>' + body.trim().split('\n').map(l => '<li>' + l.replace(/^\d+[.)] /,'') + '</li>').join('') + '</ol>');
  s = s.split(/\n{2,}/).map(block => {
    const b = block.trim();
    if (!b) return '';
    if (b.charAt(0) === '<' || b.charAt(0) === '\u0000') return b;
    return '<p>' + b.replace(/\n/g,'<br>') + '</p>';
  }).join('');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
       .replace(/`([^`]+)`/g,'<code class="inline">$1</code>');
  s = s.replace(/\u0000C(\d+)\u0000/g, (m, i) => codes[+i]);
  return s;
}
function copyText(t){
  const done = () => toast('📋 Copied');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }

function openMenu(id, ev){ ev.stopPropagation(); menuFor = id; document.getElementById('menu-modal').classList.add('open'); }
function closeMenu(){ document.getElementById('menu-modal').classList.remove('open'); }
function menuRename(){ const s = sessions.find(x => x.id === menuFor); const t = prompt('Rename chat:', s.title); if (t && t.trim()) { s.title = t.trim(); saveSessions(); renderSessions(document.getElementById('chat-search').value); } closeMenu(); }
function menuStar(){ const s = sessions.find(x => x.id === menuFor); s.star = !s.star; saveSessions(); renderSessions(document.getElementById('chat-search').value); toast(s.star ? '⭐ Starred' : '☆ Unstarred'); closeMenu(); }
function menuDelete(){ if (confirm('Delete this chat?')) { sessions = sessions.filter(x => x.id !== menuFor); if (!sessions.length) sessions.push({id: String(Date.now()), title: 'New Chat', msgs: []}); if (activeId === menuFor) activeId = sessions[0].id; saveSessions(); renderSessions(''); renderChat(); } closeMenu(); }

let rec = null, recognizing = false;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice input not supported here'); return; }
  if (recognizing) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'en-US';
  rec.onresult = e => { document.getElementById('msg').value = e.results[0][0].transcript; };
  rec.onend = () => { recognizing = false; document.getElementById('micbtn').classList.remove('live'); };
  rec.onerror = () => { recognizing = false; document.getElementById('micbtn').classList.remove('live'); };
  rec.start(); recognizing = true; document.getElementById('micbtn').classList.add('live');
}

function makeRow(s){
  const row = document.createElement('div');
  row.className = 's-row' + (s.id === activeId ? ' active' : '');
  row.onclick = () => { activeId = s.id; saveSessions(); renderSessions(''); renderChat(); closeDrawer(); };
  const t = document.createElement('span'); t.className = 's-title'; t.textContent = (s.star ? '⭐ ' : '') + s.title;
  const m = document.createElement('button'); m.className = 's-menu'; m.textContent = '⋯';
  m.onclick = e => openMenu(s.id, e);
  row.appendChild(t); row.appendChild(m);
  return row;
}
function renderSessions(filter){
  const q = (filter || '').toLowerCase();
  const list = document.getElementById('session-list');
  list.innerHTML = '';
  const match = sessions.filter(s => s.title.toLowerCase().includes(q));
  const starred = match.filter(s => s.star), rest = match.filter(s => !s.star);
  if (starred.length){ const h = document.createElement('h3'); h.textContent = 'STARRED'; list.appendChild(h); starred.forEach(s => list.appendChild(makeRow(s))); }
  if (rest.length){ const h = document.createElement('h3'); h.textContent = 'RECENTS'; list.appendChild(h); rest.forEach(s => list.appendChild(makeRow(s))); }
}

function paint(text, cls, meta, ts){
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  const c = document.createElement('div');
  if (cls === 'ai') { c.className = 'md'; c.innerHTML = fmt(text); } else { c.textContent = text; }
  if (cls === 'ai') c.querySelectorAll('pre.code').forEach(pre => {
    const b = document.createElement('button'); b.className = 'codecopy'; b.textContent = '⧉';
    b.onclick = () => copyText(pre.querySelector('code').innerText);
    pre.appendChild(b);
  });
  d.appendChild(c);
  const m = document.createElement('div'); m.className = 'meta';
  m.textContent = (meta ? meta + ' · ' : '') + (ts || '');
  d.appendChild(m);
  const a = document.createElement('div'); a.className = 'actions';
  const cp = document.createElement('button'); cp.className = 'act'; cp.textContent = '⧉ Copy'; cp.onclick = () => copyText(text); a.appendChild(cp);
  if (cls === 'ai') { const rt = document.createElement('button'); rt.className = 'act'; rt.textContent = '↻ Retry'; rt.onclick = retryLast; a.appendChild(rt); }
  d.appendChild(a);
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop = 1e6;
}
function syncView(){
  const has = active().msgs.length > 0;
  document.getElementById('empty').style.display = has ? 'none' : 'flex';
  document.getElementById('chips').style.display = has ? 'none' : 'flex';
}
function renderChat(){ document.getElementById('chat').innerHTML = ''; syncView(); active().msgs.forEach(m => paint(m.text, m.cls, m.meta, m.ts)); }
function addMsg(text, cls, meta){
  const ts = new Date().toTimeString().slice(0,5);
  paint(text, cls, meta, ts); syncView();
  active().msgs.push({text, cls, meta, ts});
  if (cls === 'user' && active().title === 'New Chat') active().title = text.slice(0, 30);
  saveSessions(); renderSessions(document.getElementById('chat-search').value);
}
function newChat(){ sessions.unshift({id: String(Date.now()), title: 'New Chat', msgs: []}); activeId = sessions[0].id; saveSessions(); renderSessions(''); renderChat(); }

function retryLast(){
  const msgs = active().msgs;
  while (msgs.length && msgs[msgs.length-1].cls === 'ai') msgs.pop();
  const lastUser = [...msgs].reverse().find(m => m.cls === 'user');
  if (!lastUser) { toast('Nothing to retry'); return; }
  saveSessions(); renderChat();
  toast('↻ Regenerating…');
  sendText(lastUser.text, '');
}

function pickImage(el){
  const f = el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      pendingImage = c.toDataURL('image/jpeg', 0.8);
      document.getElementById('imgchip').style.display = 'flex';
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
}
function clearImage(){ pendingImage = ""; document.getElementById('imgchip').style.display = 'none'; document.getElementById('img').value = ""; }

function boot(){
  if (!key) { document.getElementById('setup').style.display = 'flex'; return; }
  document.getElementById('app').style.display = 'flex';
  renderSessions(''); renderChat();
}
function saveKey(){ key = document.getElementById('key-input').value.trim(); if (!key) return; localStorage.setItem('nexus_key', key); document.getElementById('setup').style.display = 'none'; boot(); }

function send(){
  const msg = document.getElementById('msg').value.trim();
  if (!msg && !pendingImage) return;
  const img = pendingImage;
  addMsg(msg || '[Image]', 'user');
  document.getElementById('msg').value = '';
  clearImage();
  sendText(msg || "Describe this image.", img);
}

async function sendText(msg, img, attempt){
  attempt = attempt || 0;
  const t = document.createElement('div'); t.className = 'msg ai typing-msg';
  const stages = ['Routing your question…', 'Consulting specialist engines…', 'Cross-checking with Truth Engine…', 'Formatting answer…'];
  t.innerHTML = '<div class="typing"><span></span><span></span><span></span></div><div class="stage">' + stages[0] + '</div>';
  let si = 0;
  const stageTimer = setInterval(() => { si = (si + 1) % stages.length; const el = t.querySelector('.stage'); if (el) el.textContent = stages[si]; }, 8000);
  document.getElementById('chat').appendChild(t);
  document.getElementById('chat').scrollTop = 1e6;
  try {
    const res = await fetch(API + '/chat', { method: 'POST', headers: {'Content-Type':'application/json','X-NEXUS-Key':key}, body: JSON.stringify({message: msg, image_url: img, history: active().msgs.slice(-5, -1).map(m => ({role: m.cls === 'user' ? 'User' : 'NEXUS', text: m.text.slice(0, 400)}))}) });
    const data = await res.json();
    clearInterval(stageTimer);
    t.remove();
    if (res.status === 401) addMsg('🔒 Access denied. Menu → 🔑 to re-enter key.', 'ai', 'System');
    else if (res.status === 429) addMsg('⏱️ Rate limit reached. Wait 60 seconds.', 'ai', 'System');
    else addMsg(data.response || 'No response.', 'ai', 'Engine: ' + (data.engine || 'core') + (data.truth_checked ? ' · ✅ truth-checked' : ''));
  } catch(e){
    if (attempt === 0) {
      clearInterval(stageTimer);
      t.innerHTML = '<div class="meta" style="margin:0">🌙 Brain was sleeping — waking it up and retrying…</div>';
      await sleep(20000);
      t.remove();
      return sendText(msg, img, 1);
    }
    clearInterval(stageTimer);
    t.remove();
    addMsg('⚠️ Network error: ' + e.message, 'ai', 'System');
  }
}
boot();
</script>
